name: daily_checkin
description: >-
  Check-in Harian untuk Bpedia Demo v3. Aturan murni hari WIB (+1 Kelopak per
  tanggal, bonus +3 tiap hari ke-7, produk gratis tiap hari ke-30) dan halaman
  game siap pakai: strip 7 hari, kisi 30 hari, Bipy bergerak, koin terbang.
version: 3.0.0
publish_to: none
repository: https://github.com/yusufmuh/bpedia-daily-checkin

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bipy/
    - assets/art/
    - assets/fx/
